name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN needs to read the repo, publish the Pages artifact and mint the
# OIDC token that deploy-pages exchanges for a deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Re-encoding 80 masters into 612 derivatives takes ~95s. The script is
      # incremental, so a cache hit makes it a no-op; the key covers the masters
      # and the script itself, so changing either regenerates.
      - name: Cache image derivatives
        uses: actions/cache@v4
        with:
          path: |
            public/img
            public/media
            src/generated
          key: images-${{ hashFiles('assets/originals/**', 'scripts/build-images.mjs') }}

      # Must run before typecheck: src/generated/images.json is build output and
      # is not committed, so a fresh checkout has nothing for the image imports
      # to resolve against. npm run build calls this again, incrementally.
      - run: npm run images

      - run: npm run typecheck

      - run: npm run build

      - name: Check the build produced every page
        run: |
          for page in index werken series bio links contact; do
            test -s "dist/$page.html" || { echo "missing dist/$page.html"; exit 1; }
          done
          test -s dist/CNAME || { echo "missing dist/CNAME"; exit 1; }
          count=$(grep -o '<picture' dist/werken.html | wc -l)
          test "$count" -eq 41 || { echo "expected 41 works, found $count"; exit 1; }

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
